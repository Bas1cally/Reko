<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReKo Protokoll - Anmeldung</title>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>ReKo Protokoll</h1>
      <p>Wer bist du?</p>
      <div id="login-loading" class="loading" style="padding:20px">
        <div class="spinner"></div>
      </div>
      <div id="participant-grid" class="participant-grid" style="display:none"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=9"></script>
  <script src="js/auth.js?v=9"></script>
  <script>
    // Immer zuerst abmelden, damit die Auswahl gezeigt wird
    Auth.logout_silent();

    const CATEGORY_LABELS = {
      aerzte: 'Ärzte',
      sozialberatung: 'Sozialberatung',
      bgf: 'Betriebliche Gesundheitsförderung',
      wd_orga: 'WD-Organisation',
      sanitaeter: 'Notfall-/Rettungssanitäter',
      betriebsrat: 'Betriebsratsmitglied',
    };

    function showPausedError() {
      const loading = document.getElementById('login-loading');
      loading.innerHTML = `
        <div style="text-align:center; padding: 20px; color: #c0392b;">
          <div style="font-size: 2rem; margin-bottom: 12px;">&#9888;</div>
          <strong>Datenbank pausiert</strong>
          <p style="margin: 10px 0; font-size: 0.9rem; color: #555;">
            Das Supabase-Projekt wurde wegen Inaktivität pausiert.<br>
            Bitte das Projekt reaktivieren:
          </p>
          <a href="https://supabase.com/dashboard" target="_blank"
             style="display:inline-block; margin: 8px 0; padding: 8px 16px;
                    background:#3ecf8e; color:#fff; border-radius:6px;
                    text-decoration:none; font-weight:bold;">
            Supabase Dashboard &rarr;
          </a>
          <p style="margin-top: 14px; font-size: 0.8rem; color: #888;">
            Seite wird automatisch neu geladen&hellip; (<span id="retry-countdown">30</span>s)
          </p>
        </div>`;

      let seconds = 30;
      const countdownEl = document.getElementById('retry-countdown');
      const interval = setInterval(() => {
        seconds--;
        if (countdownEl) countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.reload();
        }
      }, 1000);
    }

    (async () => {
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: participants, error } = await sb
        .from('participants')
        .select('*')
        .order('sort_order');

      if (error || !participants) {
        showPausedError();
        return;
      }

      const grid = document.getElementById('participant-grid');
      const categories = [...new Set(participants.map(p => p.category))];

      // Protokolleur-Button zuerst
      const protokolleurGroup = document.createElement('div');
      protokolleurGroup.className = 'login-group';
      protokolleurGroup.innerHTML = `<div class="login-group-label">Protokollführung</div>`;
      const protokolleurItems = document.createElement('div');
      protokolleurItems.className = 'login-group-items';
      const protokolleurBtn = document.createElement('button');
      protokolleurBtn.className = 'login-participant-btn login-protokolleur-btn';
      protokolleurBtn.textContent = 'Protokolleur';
      protokolleurBtn.addEventListener('click', () => {
        Auth.setUser({ id: null, name: 'Protokolleur', role: 'protokolleur' });
        window.location.href = 'protocol.html';
      });
      protokolleurItems.appendChild(protokolleurBtn);
      protokolleurGroup.appendChild(protokolleurItems);
      grid.appendChild(protokolleurGroup);

      for (const cat of categories) {
        const catParts = participants.filter(p => p.category === cat);
        const label = CATEGORY_LABELS[cat] || cat;

        const group = document.createElement('div');
        group.className = 'login-group';
        group.innerHTML = `<div class="login-group-label">${label}</div>`;

        const items = document.createElement('div');
        items.className = 'login-group-items';

        for (const p of catParts) {
          const btn = document.createElement('button');
          btn.className = 'login-participant-btn';
          btn.textContent = p.name;
          btn.addEventListener('click', () => {
            Auth.setUser(p);
            window.location.href = 'protocol.html';
          });
          items.appendChild(btn);
        }

        group.appendChild(items);
        grid.appendChild(group);
      }

      document.getElementById('login-loading').style.display = 'none';
      grid.style.display = 'flex';
    })();
  </script>
</body>
</html>
